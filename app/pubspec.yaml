name: bauhouse
description: "BauHouse — Build Your Corner of Something Real. A daily puzzle app set in the fictional town of Elmfield."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Supabase — auth, database, realtime
  supabase_flutter: ^2.5.0

  # Routing
  go_router: ^13.0.0

  # State management
  riverpod: ^2.5.0
  flutter_riverpod: ^2.5.0

  # Animations
  lottie: ^3.1.0
  flutter_animate: ^4.5.0

  # Local storage
  shared_preferences: ^2.2.0

  # Subscriptions (RevenueCat)
  purchases_flutter: ^7.0.0

  # Ads (AdMob)
  google_mobile_ads: ^5.0.0

  # Analytics (PostHog)
  posthog_flutter: ^4.0.0

  # Image caching
  cached_network_image: ^3.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/animations/

  fonts:
    - family: DMSans
      fonts:
        - asset: assets/fonts/DMSans-Regular.ttf
        - asset: assets/fonts/DMSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/DMSans-Bold.ttf
          weight: 700
